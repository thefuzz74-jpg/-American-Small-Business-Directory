name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show build errors clearly
        if: failure()
        run: |
          echo "### Android build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          grep -n -E -A 10 'What went wrong|Execution failed|^e: |error:|FAILURE:|Could not resolve|Could not find|Android resource linking failed' build.log | tail -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-error-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: american-small-business-directory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
